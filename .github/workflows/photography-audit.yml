name: Validate editorial photo sources
on:
  pull_request:
    paths:
      - 'tests/photography-audit.mjs'
      - '.github/workflows/photography-audit.yml'
      - '**/content/photography.js'
  workflow_dispatch:
jobs:
  photo-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tests/photography-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photo-url-availability
          path: photo-audit-results.json
          if-no-files-found: ignore
