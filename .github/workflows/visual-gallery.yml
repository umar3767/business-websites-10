name: Premium visual screenshot gallery
on:
  pull_request:
    paths:
      - 'tests/visual.spec.mjs'
      - 'playwright.visual.config.mjs'
      - '.github/workflows/visual-gallery.yml'
  workflow_dispatch:
jobs:
  visual-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.visual.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premium-design-gallery
          path: screenshots/premium/
          if-no-files-found: warn
